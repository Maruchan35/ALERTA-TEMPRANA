# Pruebas automáticas de ALERTA CERCA: se ejecutan en cada push y pull request.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  sql:
    name: Backend · SQL (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/pruebas
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/pruebas/package-lock.json
      - run: npm ci
      - name: Migraciones, RLS, reglas de confianza y radio dinámico (P01–P19)
        run: npm test

  puente-whatsapp:
    name: Puente de WhatsApp (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puente-whatsapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: puente-whatsapp/package-lock.json
      - run: npm ci
      - name: Configuración, números de México y llamadas al servidor
        run: npm test

  edge-functions:
    name: Backend · Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tipos, lint y formato
        run: deno task revisar
      - name: Pruebas (geohash, FCM, CAP, mensajes, seguridad)
        run: deno task probar

  flutter:
    name: Flutter · ${{ matrix.paquete }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paquete: [compartido, app, panel]
    defaults:
      run:
        working-directory: ${{ matrix.paquete }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Análisis estático
        run: flutter analyze
      - name: Pruebas
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/pruebas.txt"
      - name: Mostrar los errores de las pruebas como anotaciones
        if: failure()
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/anotar_errores.py" "$RUNNER_TEMP/pruebas.txt" "Pruebas · ${{ matrix.paquete }}"

  compilar:
    name: Compilar · APK y web (modo demostración)
    needs: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: APK de la app (modo demostración, sin backend)
        working-directory: app
        run: flutter build apk --release --dart-define=DEMO=true
      - name: Web de la app
        working-directory: app
        run: flutter build web --release --dart-define=DEMO=true
      - name: Web del panel de validadores
        working-directory: panel
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: alerta-cerca-demo-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
