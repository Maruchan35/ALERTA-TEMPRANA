# ALERTA CERCA · configuración de Supabase CLI.
# Sirve para el desarrollo local (`supabase start`, requiere Docker) y para desplegar
# (`supabase link`, `supabase db push`, `supabase functions deploy`). Ver docs/despliegue.md.

project_id = "alerta-cerca"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Catálogo de categorías y escalones del radio dinámico
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Recibir alertas NO requiere cuenta: la app inicia una sesión anónima.
enable_anonymous_sign_ins = true
minimum_password_length = 8

[auth.rate_limit]
# Por hora y por IP: en un evento muchas personas comparten la misma red Wi-Fi
anonymous_users = 150
sms_sent = 100
token_verifications = 30

[auth.email]
# ¡Ojo! En un proyecto en la nube, `enable_signup` es el interruptor del PROVEEDOR Email:
# con false nadie puede iniciar sesión con correo (ni los validadores en la app ni el panel).
# El registro público queda cerrado de otra forma: toda cuenta nueva debe confirmar su
# correo, y las de los validadores las crea un administrador ya confirmadas
# (Authentication → Add user → Auto Confirm User). Además, una cuenta de correo sin
# teléfono verificado no puede reportar ni confirmar (007_colmena.sql).
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.sms]
# Quien quiere REPORTAR verifica su número (convierte la cuenta anónima en verificada).
# El código ya NO viaja por SMS sino por WhatsApp: ver [auth.hook.send_sms] más abajo.
enable_signup = true
enable_confirmations = false
template = "Tu código de ALERTA CERCA es {{ .Code }}"
max_frequency = "30s"

# Sin números de prueba con código fijo: esos se saltarían el hook de WhatsApp. La tabla vacía
# hace que `supabase config push` borre los que hubiera en el proyecto.
[auth.sms.test_otp]

# Supabase pide un proveedor de SMS para activar el acceso por teléfono. Queda uno de relleno
# que nunca se usa: con el hook de abajo, Auth entrega cada código a WhatsApp, no a Twilio.
[auth.sms.twilio]
enabled = true
account_sid = "AC00000000000000000000000000000000"
message_service_sid = "MG00000000000000000000000000000000"
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Verificación por WhatsApp (009_whatsapp.sql): Auth genera el código y se lo pasa a esta función
# en vez de mandar un SMS. Mientras `config.whatsapp_simulado` sea true, el mensaje es SIMULADO:
# la app que lo pidió lo muestra como si le hubiera llegado por WhatsApp (cualquier número sirve).
[auth.hook.send_sms]
enabled = true
uri = "pg-functions://postgres/public/enviar_codigo_whatsapp"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Funciones que NO reciben un JWT de Supabase: se autentican con su propio secreto
# (pg_net → x-alerta-secreto; Telegram → X-Telegram-Bot-Api-Secret-Token) o son públicas (cap).
[functions.notificar]
verify_jwt = false

[functions.telegram-webhook]
verify_jwt = false

[functions.cap]
verify_jwt = false

[functions.mantenimiento]
verify_jwt = false

[functions.whatsapp]
verify_jwt = false

[analytics]
enabled = false
