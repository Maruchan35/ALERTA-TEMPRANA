# ALERTA CERCA · configuración de Supabase CLI.
# Sirve para el desarrollo local (`supabase start`, requiere Docker) y para desplegar
# (`supabase link`, `supabase db push`, `supabase functions deploy`). Ver docs/despliegue.md.

project_id = "alerta-cerca"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Catálogo de categorías y escalones del radio dinámico
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Recibir alertas NO requiere cuenta: la app inicia una sesión anónima.
enable_anonymous_sign_ins = true
minimum_password_length = 8

[auth.rate_limit]
anonymous_users = 30
sms_sent = 30
token_verifications = 30

[auth.email]
# Las cuentas de validadores las crea un administrador (Authentication → Add user).
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

[auth.sms]
# Quien quiere REPORTAR verifica su número (convierte la cuenta anónima en verificada).
enable_signup = true
enable_confirmations = false
template = "Tu código de ALERTA CERCA es {{ .Code }}"
max_frequency = "30s"

# Números de prueba para la demo: no envían SMS y el código es fijo (123456). En la app se
# escriben a 10 dígitos (5511111111). Sirven desde cualquier teléfono: 1 número = 1 cuenta.
[auth.sms.test_otp]
525511111111 = "123456"
525522222222 = "123456"
525533333333 = "123456"
525544444444 = "123456"
525555555555 = "123456"
525566666666 = "123456"
525577777777 = "123456"
525588888888 = "123456"

# Supabase exige un proveedor de SMS para activar el acceso por teléfono. En el prototipo se
# deja uno de relleno: los números de prueba NO pasan por el proveedor. Para números reales,
# crea una cuenta de Twilio, pon aquí sus datos y define el token en la variable de entorno.
[auth.sms.twilio]
enabled = true
account_sid = "AC00000000000000000000000000000000"
message_service_sid = "MG00000000000000000000000000000000"
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Funciones que NO reciben un JWT de Supabase: se autentican con su propio secreto
# (pg_net → x-alerta-secreto; Telegram → X-Telegram-Bot-Api-Secret-Token) o son públicas (cap).
[functions.notificar]
verify_jwt = false

[functions.telegram-webhook]
verify_jwt = false

[functions.cap]
verify_jwt = false

[functions.mantenimiento]
verify_jwt = false

[analytics]
enabled = false
